              React.createElement("div", { style: { fontSize: 20, fontWeight: 700, color: verdictColors[c.recommendation.verdict] } }, `${c.recommendation.confidence}%`)
            ),
            React.createElement("div", { style: { width: "100%", fontSize: 11, color: "#f59e0b", display: "flex", gap: 6 } }, React.createElement("span", null, "!"), c.recommendation.risk)
          )
        ),

        // ── SIGNALS ──
        activeSection === "signals" && React.createElement("div", null,
          React.createElement("div", { style: { fontSize: 10, color: "#7d8590", letterSpacing: "0.1em", marginBottom: 16 } }, `CTO EVALUATION SIGNALS · ${c.name.toUpperCase()}`),
          React.createElement("div", { style: { display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 12 } },
            [
              { key: "complexity",   label: "Problem complexity",  icon: "🔩", color: "#38bdf8" },
              { key: "ownership",    label: "Ownership signals",    icon: "🎯", color: "#22c55e" },
              { key: "scale",        label: "Scale exposure",       icon: "📈", color: "#a78bfa" },
              { key: "product",      label: "Product thinking",     icon: "💡", color: "#f59e0b" },
              { key: "startupFit",   label: "Startup fit",          icon: "🚀", color: "#f472b6" },
              { key: "systems",      label: "Systems experience",   icon: "⚙️", color: "#34d399" },
              { key: "collaboration",label: "Collaboration",        icon: "🤝", color: "#60a5fa" },
            ].map(sig =>
              React.createElement("div", { key: sig.key, style: { background: "#161b22", border: "1px solid #21262d", borderRadius: 8, padding: "14px 16px", borderLeft: `3px solid ${sig.color}` } },
                React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 8 } },
                  React.createElement("span", { style: { fontSize: 14 } }, sig.icon),
                  React.createElement("span", { style: { fontSize: 11, fontWeight: 500, color: sig.color, letterSpacing: "0.06em" } }, sig.label.toUpperCase())
                ),
                React.createElement("p", { style: { fontSize: 12, color: "#c9d1d9", lineHeight: 1.65, margin: 0 } }, c.signals[sig.key])
              )
            )
          )
        ),

        // ── INTERVIEW ──
        activeSection === "interview" && React.createElement("div", null,
          React.createElement("div", { style: { fontSize: 10, color: "#7d8590", letterSpacing: "0.1em", marginBottom: 16 } }, `INTERVIEW PLAN · ${c.name.toUpperCase()}`),
          React.createElement("div", { style: { display: "flex", flexDirection: "column", gap: 10 } },
            INTERVIEW_PLAN.map((stage, i) =>
              React.createElement("div", { key: i, style: { background: "#161b22", border: "1px solid #21262d", borderRadius: 8, padding: "16px 18px", display: "flex", gap: 16 } },
                React.createElement("div", { style: { fontSize: 22, flexShrink: 0, width: 36, textAlign: "center", paddingTop: 2 } }, stage.icon),
                React.createElement("div", { style: { flex: 1 } },
                  React.createElement("div", { style: { display: "flex", alignItems: "center", gap: 10, marginBottom: 8 } },
                    React.createElement("span", { style: { fontSize: 10, padding: "2px 8px", border: "1px solid #30363d", borderRadius: 4, color: "#7d8590" } }, `Stage ${i + 1}`),
                    React.createElement("span", { style: { fontSize: 13, fontWeight: 500, color: "#f0f6fc" } }, stage.stage)
                  ),
                  React.createElement("div", { style: { display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 10 } },
                    React.createElement("div", null,
                      React.createElement("div", { style: { fontSize: 10, color: "#7d8590", marginBottom: 3 } }, "PURPOSE"),
                      React.createElement("div", { style: { fontSize: 12, color: "#c9d1d9" } }, stage.purpose)
                    ),
                    React.createElement("div", null,
                      React.createElement("div", { style: { fontSize: 10, color: "#7d8590", marginBottom: 3 } }, "VALIDATE"),
                      React.createElement("div", { style: { fontSize: 12, color: "#c9d1d9" } }, stage.validate)
                    )
                  ),
                  React.createElement("div", { style: { background: "rgba(56,189,248,0.06)", border: "1px solid rgba(56,189,248,0.15)", borderRadius: 6, padding: "10px 14px" } },
                    React.createElement("div", { style: { fontSize: 10, color: "#38bdf8", marginBottom: 5 } }, "SAMPLE QUESTION"),
                    React.createElement("div", { style: { fontSize: 12, color: "#c9d1d9", fontStyle: "italic", lineHeight: 1.6 } }, `"${stage.question}"`)
                  )
                )
              )
            )
          )
        ),

        // ── SCORECARD ──
        activeSection === "scorecard" && React.createElement("div", null,
          React.createElement("div", { style: { fontSize: 10, color: "#7d8590", letterSpacing: "0.1em", marginBottom: 16 } }, `EVALUATION SCORECARD · ${c.name.toUpperCase()}`),
          React.createElement("div", { style: { background: "#161b22", border: "1px solid #21262d", borderRadius: 10, overflow: "hidden" } },
            React.createElement("div", { style: { display: "grid", gridTemplateColumns: "180px 80px 1fr 1fr", borderBottom: "1px solid #21262d", padding: "10px 16px" } },
              ["Category", "Score", "Evidence", "Risk"].map(h =>
                React.createElement("div", { key: h, style: { fontSize: 10, color: "#7d8590", letterSpacing: "0.08em" } }, h.toUpperCase())
              )
            ),
            c.scorecard.map((row, i) =>
              React.createElement("div", { key: i, style: { display: "grid", gridTemplateColumns: "180px 80px 1fr 1fr", padding: "12px 16px", borderBottom: i < c.scorecard.length - 1 ? "1px solid #161b22" : "none", alignItems: "center", background: i % 2 === 0 ? "transparent" : "rgba(255,255,255,0.015)" } },
                React.createElement("div", { style: { fontSize: 12, color: "#c9d1d9", fontWeight: 500 } }, row.cat),
                React.createElement("div", { style: { display: "flex", gap: 3 } },
                  [1,2,3,4,5].map(n =>
                    React.createElement("div", { key: n, style: { width: 8, height: 8, borderRadius: 2, background: n <= row.score ? (row.score >= 4 ? "#22c55e" : row.score === 3 ? "#f59e0b" : "#ef4444") : "#21262d" } })
                  )
                ),
                React.createElement("div", { style: { fontSize: 11, color: "#7d8590", lineHeight: 1.5 } }, row.evidence),
                React.createElement("div", { style: { fontSize: 11, color: row.risk === "Low" ? "#22c55e" : "#f59e0b", lineHeight: 1.5 } }, row.risk)
              )
            )
          ),
          React.createElement("div", { style: { marginTop: 16, background: `${verdictColors[c.recommendation.verdict]}10`, border: `1px solid ${verdictColors[c.recommendation.verdict]}30`, borderRadius: 8, padding: "14px 18px", display: "flex", gap: 20, alignItems: "center" } },
            React.createElement("div", null,
              React.createElement("div", { style: { fontSize: 10, color: "#7d8590", marginBottom: 2 } }, "VERDICT"),
              React.createElement("div", { style: { fontSize: 24, fontWeight: 700, color: verdictColors[c.recommendation.verdict] } }, c.recommendation.verdict)
            ),
            React.createElement("div", { style: { flex: 1 } },
              React.createElement("div", { style: { fontSize: 12, color: "#c9d1d9", marginBottom: 4 } }, c.recommendation.reason),
              React.createElement("div", { style: { fontSize: 11, color: "#f59e0b" } }, `Risk: ${c.recommendation.risk}`)
            ),
            React.createElement("div", { style: { textAlign: "center" } },
              React.createElement("div", { style: { fontSize: 10, color: "#7d8590", marginBottom: 2 } }, "CONFIDENCE"),
              React.createElement("div", { style: { fontSize: 22, fontWeight: 700, color: verdictColors[c.recommendation.verdict] } }, `${c.recommendation.confidence}%`)
            )
          )
        )
      )
    ),

    // FOOTER
    React.createElement("div", { style: { borderTop: "1px solid #21262d", padding: "12px 32px", display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 } },
      React.createElement("span", { style: { fontSize: 11, color: "#7d8590" } }, "This dashboard helps TA teams partner more effectively with CTOs by combining structured evaluation, behavioural evidence, and technical hiring signals."),
      React.createElement("span", { style: { fontSize: 10, color: "#30363d" } }, "Built by Nic Venter · Engineering Hiring Intelligence")
    )
  );
}

root.render(React.createElement(App));
